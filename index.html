<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcade</title><style>:root{color-scheme:dark;--b:#080a10;--p:#121622;--s:#191e2d;--v:#8b79ff;--c:#42e6ce;--l:#ffffff10}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 0,#39227a55,transparent 30%),radial-gradient(circle at 0 100%,#0b786c30,transparent 28%),var(--b);font-family:Inter,system-ui;color:#f8f8ff}.app{min-height:100vh;display:grid;grid-template-columns:92px 1fr;gap:16px;padding:16px}.side,.top,.panel{background:#10131dd9;border:1px solid var(--l);box-shadow:0 25px 70px #0007;backdrop-filter:blur(18px)}.side{border-radius:25px;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:10px}.mark,.btn{display:grid;place-items:center;border:0;color:#969daf;background:transparent;cursor:pointer;border-radius:16px;transition:.2s}.mark{width:44px;height:44px;margin-bottom:20px;color:white;background:linear-gradient(135deg,var(--v),#d16fe0);box-shadow:0 10px 28px #8771ff77}.btn{width:48px;height:48px}.btn:hover,.btn.on{color:#fff;background:#8976ff25;box-shadow:inset 0 0 0 1px #b8adff22}.bottom{margin-top:auto}.main{display:grid;grid-template-rows:76px 1fr;gap:16px;min-width:0}.top{border-radius:22px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 25px}.ghost{width:120px;height:10px;border-radius:10px;background:linear-gradient(90deg,#f7f7ff,#ffffff20)}.tools{display:flex;gap:10px;align-items:center}.sm{width:42px;height:42px;border:0;border-radius:14px;background:var(--s);color:#a2a7b5;display:grid;place-items:center;cursor:pointer}.avatar{width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--v),var(--c),#ed76c9,var(--v));padding:2px}.avatar:after{content:'';display:block;width:100%;height:100%;border-radius:50%;background:#171a27;border:3px solid #171a27}.grid{display:grid;grid-template-columns:1fr 290px;gap:16px}.panel{border-radius:26px}.library{padding:24px;display:flex;flex-direction:column;min-height:580px;overflow:hidden;position:relative}.head{display:flex;justify-content:space-between}.pills{display:flex;gap:8px}.pill{height:30px;width:48px;border-radius:11px;background:#ffffff0b}.pill:first-child{background:linear-gradient(90deg,var(--v),#b597ff);box-shadow:0 8px 22px #8b79ff55}.view{display:flex;gap:7px}.mini{border:0;background:transparent;color:#949aaa;width:30px;border-radius:9px}.mini:first-child{color:#fff;background:#ffffff12}.empty{flex:1;display:grid;place-items:center}.orbit{width:142px;height:142px;border:1px solid #a090ff55;border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:inset 0 0 48px #8b79ff1c}.orbit:before,.orbit:after{content:'';position:absolute;border-radius:50%;background:var(--c);box-shadow:0 0 15px var(--c)}.orbit:before{width:8px;height:8px;right:20px;top:20px}.orbit:after{width:5px;height:5px;left:15px;bottom:36px;background:#c694ff}.core{height:68px;width:68px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--v),var(--c));transform:rotate(-8deg);box-shadow:0 18px 30px #8b79ff44}.core svg{transform:rotate(8deg)}.plus{margin:22px auto 0;width:54px;height:54px;border:0;border-radius:19px;background:#f6f6fb;color:#10111a;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 25px #fff2}.plus:hover{transform:translateY(-3px)}.right{padding:20px;display:flex;flex-direction:column;gap:16px}.rhead{display:flex;justify-content:space-between}.short{width:60px;height:9px;border-radius:8px;background:#e9eaff}.dots{letter-spacing:4px;color:#8e94a5}.chart{height:132px;border-radius:19px;border:1px solid #8b79ff22;background:linear-gradient(145deg,#8b79ff26,#42e6ce08);display:flex;align-items:end;gap:7px;padding:18px}.bar{flex:1;border-radius:7px 7px 3px 3px;background:linear-gradient(#8b79ff,#8b79ff22)}.bar:nth-child(1){height:28%}.bar:nth-child(2){height:53%}.bar:nth-child(3){height:38%}.bar:nth-child(4){height:78%}.bar:nth-child(5){height:62%}.bar:nth-child(6){height:94%;background:linear-gradient(var(--c),#42e6ce22)}.row{height:54px;border-radius:16px;background:#ffffff08;display:flex;align-items:center;gap:10px;padding:0 12px}.sq{height:29px;width:29px;border-radius:10px;background:linear-gradient(135deg,#8b79ff,#42e6ce)}.line{height:7px;flex:1;border-radius:8px;background:#ffffff18}.dot{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}.sliders{margin-top:auto;display:grid;gap:18px;padding:10px 2px}.slider{height:5px;border-radius:10px;background:#ffffff16;position:relative}.slider:before{content:'';position:absolute;height:100%;width:65%;border-radius:10px;background:linear-gradient(90deg,var(--v),var(--c))}.slider:nth-child(2):before{width:38%}.slider:nth-child(3):before{width:82%}.slider:after{content:'';position:absolute;left:calc(65% - 6px);top:-4px;width:13px;height:13px;border-radius:50%;background:white}.slider:nth-child(2):after{left:calc(38% - 6px)}.slider:nth-child(3):after{left:calc(82% - 6px)}.modal{display:none;position:fixed;inset:0;background:#05060a99;backdrop-filter:blur(8px);place-items:center}.modal.show{display:grid}.card{width:min(490px,calc(100% - 32px));padding:25px;border-radius:26px;background:#151927;border:1px solid #ffffff18;box-shadow:0 25px 80px #0009}.settings{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.tile{aspect-ratio:1;border-radius:17px;display:grid;place-items:center;background:#ffffff0a;color:#9aa1b2}.tile.on{background:#8b79ff35;color:#fff}.long{height:11px;border-radius:8px;background:#ffffff12;margin:14px 0}.long:nth-last-child(1){width:72%}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}@media(max-width:800px){.app{grid-template-columns:1fr;padding:10px}.side{height:70px;flex-direction:row;padding:0 12px;justify-content:space-between;order:2}.mark{margin:0}.side nav{display:flex}.side nav .btn:nth-child(n+4){display:none}.bottom{margin:0}.grid{grid-template-columns:1fr}.right{display:none}.library{min-height:calc(100vh - 180px)}} </style><body><div class="app"><aside class="side"><div class="mark"><svg viewBox="0 0 24 24"><path d="M5 12 12 5l7 7v7H5zM10 19v-5h4v5"/></svg></div><nav><button class="btn on"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button><button class="btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m15 9-2 4-4 2 2-4z"/></svg></button><button class="btn"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6zM6 10h12"/></svg></button></nav><div class="bottom"><button class="btn set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4"/></svg></button></div></aside><main class="main"><header class="top"><i class="ghost"></i><div class="tools"><button class="sm"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg></button><button class="sm set"><svg viewBox="0 0 24 24"><path d="M12 3v2m0 14v2M3 12h2m14 0h2"/><circle cx="12" cy="12" r="4"/></svg></button><i class="avatar"></i></div></header><section class="grid"><div class="panel library"><div class="head"><div class="pills"><i class="pill"></i><i class="pill"></i><i class="pill"></i></div><div class="view"><button class="mini">▦</button><button class="mini">☷</button></div></div><div class="empty"><div><div class="orbit"><div class="core"><svg viewBox="0 0 24 24"><path d="M6 9h12l3 4-3 3H6l-3-3zM8 13h4m-2-2v4m6-2h.1m2-1h.1"/></svg></div></div><button class="plus set"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div></div><aside class="panel right"><div class="rhead"><i class="short"></i><i class="dots">•••</i></div><div class="chart"><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i></div><div class="row"><i class="sq"></i><i class="line"></i><i class="dot"></i></div><div class="row"><i class="sq"></i><i class="line"></i><i class="dot"></i></div><div class="row"><i class="sq"></i><i class="line"></i><i class="dot"></i></div><div class="sliders"><i class="slider"></i><i class="slider"></i><i class="slider"></i></div></aside></section></main></div><div class="modal"><div class="card"><button class="sm close">×</button><div class="settings"><i class="tile on">◐</i><i class="tile">♪</i><i class="tile">⌘</i><i class="tile">⌾</i></div><i class="long"></i><i class="long"></i><i class="long"></i></div></div><script>const m=document.querySelector('.modal');document.querySelectorAll('.set').forEach(b=>b.onclick=()=>m.classList.add('show'));document.querySelector('.close').onclick=()=>m.classList.remove('show');m.onclick=e=>{if(e.target==m)m.classList.remove('show')}</script></body></html>
<style>.empty{display:block;padding-top:42px}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:940px;margin:auto}.game{min-height:220px;position:relative;overflow:hidden;text-decoration:none;color:#fff;border:1px solid #ffffff13;border-radius:22px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(145deg,var(--a),#10131b 72%);box-shadow:inset 0 1px #fff1,0 18px 38px #0003;transition:.25s}.game:hover{transform:translateY(-5px);border-color:#ffffff45;box-shadow:0 22px 44px #0007}.game:before{content:'';position:absolute;width:190px;height:190px;border-radius:50%;right:-35px;top:-35px;background:radial-gradient(circle,#ffffff3b,transparent 66%)}.game:after{content:'↗';position:absolute;right:19px;bottom:17px;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:#ffffff1c;color:#fff}.icon{position:absolute;top:19px;left:20px;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#ffffff16;font-size:21px;backdrop-filter:blur(8px)}.name{font-weight:750;font-size:22px;letter-spacing:-.5px;position:relative}.kind{margin-top:5px;color:#ffffffa8;font-size:12px;letter-spacing:.12em;text-transform:uppercase;position:relative}@media(max-width:700px){.games{grid-template-columns:1fr}.empty{padding-top:12px}}</style><script>const games=[['2048','Puzzle','🔢','https://play2048.co/','#6c4dd3'],['HexGL','Racing','◈','https://hexgl.bkcore.com/','#006a80'],['Pacman','Arcade','●','https://pacman.love/game','#c8a400'],['Hextris','Arcade','⬡','https://hextris.io/','#b23d87']];document.querySelector('.empty').innerHTML='<div class="games">'+games.map(g=>'<a class="game" href="'+g[3]+'" target="_blank" rel="noopener" style="--a:'+g[4]+'"><span class="icon">'+g[2]+'</span><span class="name">'+g[0]+'</span><span class="kind">'+g[1]+'</span></a>').join('')+'</div>';</script>
